<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love You, Sayangku Claire ❤️</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .love-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 35px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
            animation: muncul 1s ease;
        }

        .heart {
            font-size: 80px;
            animation: denyut 1.2s infinite;
        }

        h1 {
            font-weight: 700;
            color: #e91e63;
        }

        .subtitle {
            color: #777;
            font-size: 18px;
        }

        .btn-love {
            background: #e91e63;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            color: white;
            transition: .3s;
        }

        .btn-love:hover {
            background: #c2185b;
            transform: scale(1.05);
            color: white;
        }

        @keyframes denyut {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating-heart {
            position: absolute;
            color: rgba(255,255,255,.6);
            font-size: 25px;
            animation: naik 6s linear infinite;
        }

        @keyframes naik {
            from {
                transform: translateY(110vh);
                opacity: 0;
            }
            20% { opacity: 1; }
            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="floating-heart" style="left:10%; animation-delay:0s;">❤️</div>
    <div class="floating-heart" style="left:25%; animation-delay:2s;">💕</div>
    <div class="floating-heart" style="left:45%; animation-delay:4s;">❤️</div>
    <div class="floating-heart" style="left:70%; animation-delay:1s;">💗</div>
    <div class="floating-heart" style="left:85%; animation-delay:3s;">❤️</div>

    <div class="love-card">
        <div class="heart">❤️</div>

        <h1 class="mt-3">Love You</h1>

        <h2 class="fw-bold">
            Sayangku Claire
        </h2>

        <p class="subtitle mt-3">
            Kamu adalah orang yang selalu punya tempat spesial
            di hati aku. ❤️
        </p>

        <button class="btn btn-love mt-3" onclick="showLove()">
            Klik Aku 💕
        </button>

        <div id="message" class="mt-4 fw-bold text-danger"></div>
    </div>

    <script>
        function showLove() {
            document.getElementById("message").innerHTML =
                "Aku sayang banget sama kamu, Claire ❤️🥰";
        }
    </script>

</body>
</html>
